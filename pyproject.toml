[project]
name = "finsent-calib"
version = "0.1.0"
description = "Calibrated financial sentiment signal with a LoRA fine-tuned small LLM"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Li Zhuofei Felix", email = "229174898+lizhuofei-felix@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "datasets>=5.2.0",
    "huggingface-hub>=2.4.0",
    "matplotlib>=3.11.2",
    "pandas>=3.1.1",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "torch>=2.15.0",
    "transformers>=5.22.2",
]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
